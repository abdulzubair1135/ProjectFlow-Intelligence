server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

spring:
  application:
    name: projectflow-server
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:h2:mem:projectflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${SUPABASE_DB_USER:sa}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  env: ${APP_ENV:development}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  supabase:
    url: ${SUPABASE_URL:https://demo.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:placeholder-anon-key}
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:https://demo.supabase.co/auth/v1}
      jwks-url: ${SUPABASE_JWT_JWKS_URL:}
